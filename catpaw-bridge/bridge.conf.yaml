# =============================================================================
# CatPawAI Bridge - 统一配置文件
# =============================================================================
# 所有组件（反代、CLIProxyAPI、cc-switch）的配置集中在此文件。
# 修改配置后重启服务即可生效: ./start.sh --stop && ./start.sh
#
# 配置优先级: 环境变量 > bridge.conf.yaml > 代码内默认值
# =============================================================================

# ---- 网络 ----
cliproxy:
  port: 8317                    # CLIProxyAPI 监听端口
  api_key: "sk-catpaw-bridge-key"  # Claude Code 认证密钥（cc-switch 用同一个）

catpaw_proxy:
  port: 9000                    # CatPawAI 反向代理监听端口
  verbose: true                 # 详细日志
  # 关闭工具定义自动注入（默认 false）
  # true: 不将 tools 数组注入到 CatPawAI 请求中，大幅减小请求体
  #       仍保留 tool 消息转换 + <tool_call> 响应解析
  #       你可以在 system prompt 中手动描述需要的工具
  strip_tool_definitions: false

# ---- 请求体大小限制 ----
limits:
  # CatPawAI 上游对加密请求体有大小限制（约 128KB）
  # 超过此值上游会直接关闭连接，不返回任何 HTTP 响应
  max_encrypted_body: 180000    # 加密后最大字节数（警告阈值）
  # 系统消息截断阈值（Claude Code 的 system prompt 含完整工具描述，
  # 通常 80-120KB，我们已用紧凑格式注入工具定义，可安全截断）
  max_system_content: 8000      # 系统消息最大字符数
  # 普通消息截断阈值（如 Read 工具返回的大文件内容）
  max_message_content: 15000    # 非系统消息最大字符数

# ---- CatPawAI 上游 ----
catpaw:
  api_host: "catpaw.meituan.com"
  data_dir: "~/Library/Application Support/CatPawAI"  # CatPawAI IDE 数据目录
  sso_client_id: "1d47d6ff96"
  sso_client_id_2: "f32a546874"
  tenant_id: "5282fa6645"
  need_passport_id: true        # tenant 5282fa6645 使用 passportid cookie

# ---- 模型 ----
model:
  name: "glm-5.2"               # CatPawAI 上游模型名
  type_code: 2                  # 1=快速, 2=精确
  # 伪装别名: 让 Claude Code 能用 claude-sonnet-4-20250514 名称访问
  aliases:
    - "glm-5.2"
    - "claude-sonnet-4-20250514"

# ---- CCG 技能注入 ----
# CCG (Code Craft Guide) 路由规则自动注入到系统提示词
# 启用后，Bridge 会在模块加载时一次性构建增强系统提示词：
#   1. 初始设置指令（读取 CLAUDE.md / AGENTS.md）
#   2. CCG 技能路由规则（领域专家知识自动检测）
#   3. CCG 质量门（代码变更后自动触发）
#   4. 工具调用规则（格式 + 严格约束）
# 构建结果缓存在内存中，零每请求开销（高缓存）
ccg:
  enabled: true                 # 启用 CCG 上下文注入（检测到 ~/.claude/rules/ 自动启用）

# ---- Claude Code 配置 (cc-switch 用) ----
claude_code:
  # 直接使用模型名
  model: "glm-5.2"
  small_model: "glm-5.2"
  # 伪装模式（某些工具硬编码模型名时使用）
  masked_model: "claude-sonnet-4-20250514"
  masked_small_model: "claude-sonnet-4-20250514"
  # 官方 API（切换回官方时用）
  official_base_url: "https://api.anthropic.com"
  official_model: "claude-sonnet-4-20250514"
  official_small_model: "claude-3-5-haiku-20241022"

# ---- Codex CLI 配置 (codex-switch 用) ----
codex:
  model: "glm-5.2"               # Codex CLI 默认模型 (别名，映射到 glm-5.2)
  reasoning_effort: "high"       # 推理强度: low | medium | high
                                 # 注意: 当前 CLIProxyAPI 不支持 max，最高为 high
  wire_api: "responses"          # Codex 强制要求 responses = /v1/responses
                                 # CLIProxyAPI 翻译层已在 [DONE] 时正确发出 response.completed 事件
                                 # 根级 /responses 路由也已就绪，Codex 可直接访问
  official_model: "gpt-4.1"      # 切换回官方时的模型
  official_base_url: "https://api.openai.com/v1"
